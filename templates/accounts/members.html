{% extends "base.html" %}
{% block title %}Members{% endblock %}
{% block content %}
  <h1>Members</h1>
  <ul>{% for membership in memberships %}<li>{{ membership.user.email }} — {{ membership.get_role_display }}</li>{% endfor %}</ul>
  <form method="post" class="panel">{% csrf_token %}
    <label>Email <input class="control" type="email" name="email" required></label>
    <label>Role <select class="control" name="role">{% for value, label in roles %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
    <button type="submit">Save membership</button>
  </form>
{% endblock %}
